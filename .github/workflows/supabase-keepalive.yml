# Pings Supabase every 3 days so the free-tier project doesn't auto-pause
# (it pauses after ~1 week idle, which killed logins twice during testing).
# The anon key is public by design (it ships in the site bundle).
name: supabase-keepalive
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        # NOTE: no pipe after curl — a pipe (e.g. "| head") masks curl's exit
        # code and the job stays green while the project is down. That is
        # exactly how the Aug/Sep 2026 pause went unnoticed for a week.
        run: |
          RESP=$(curl -sS --fail-with-body --max-time 20 -X POST \
            'https://gwpjbqvguepqzarsisrr.supabase.co/rest/v1/rpc/app_login' \
            -H 'apikey: sb_publishable_yjsJriKKvIPDPrHgKYq1wA_pQWYAu1M' \
            -H 'Content-Type: application/json' \
            -d '{"p_username":"__keepalive__","p_password":"__keepalive__"}')
          echo "response: ${RESP:0:200}"
          # the probe user doesn't exist, so a LIVE server answers {"error":"invalid"}
          case "$RESP" in
            *invalid*) echo "Supabase is alive." ;;
            *) echo "Unexpected response — Supabase may be down."; exit 1 ;;
          esac

# Pings Supabase every 3 days so the free-tier project doesn't auto-pause
# (it pauses after ~1 week idle, which killed logins twice during testing).
# The anon key is public by design (it ships in the site bundle).
name: supabase-keepalive
on:
  schedule:
    - cron: '17 6 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        run: |
          curl -s -X POST \
            'https://vhumyfderrygpsvllysk.supabase.co/rest/v1/rpc/app_login' \
            -H 'apikey: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InZodW15ZmRlcnJ5Z3BzdmxseXNrIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Njg3OTEyMDAsImV4cCI6MjA4NDM2NzIwMH0.NxYXGFrl7-ORDKoPrwlzwljwbf8w67moF9UAifGYeFc' \
            -H 'Content-Type: application/json' \
            -d '{"p_username":"__keepalive__","p_password":"__keepalive__"}' \
            | head -c 200
